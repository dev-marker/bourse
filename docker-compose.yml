# What every service of the exchange has in common: our own image, which make images builds and
# nobody ever pulls, and the exchange profile, so it only runs with --profile exchange.
x-bourse: &bourse
  image: bourse:latest
  pull_policy: never
  profiles: [exchange]
  restart: unless-stopped

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: bourse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bourse}
    ports:
      - "5432:5432"
    volumes:
      - ./deploy/postgres:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "bourse"]
      interval: 2s
      retries: 15

  kafka:
    image: apache/kafka:4.4.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # Two doors: localhost:9092 for programs on this machine, kafka:19092 for containers.
      KAFKA_LISTENERS: PLAINTEXT://:9092,DOCKER://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,DOCKER://kafka:19092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,DOCKER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 5s
      timeout: 10s
      retries: 20

  # Prometheus scrapes the services, which run on this machine: from a container, that's
  # host.docker.internal.
  prometheus:
    image: prom/prometheus:v3.15.1
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus:/etc/prometheus:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Grafana, with Prometheus and the dashboard set up already, and no login: anyone may look.
  grafana:
    image: grafana/grafana:13.2.6
    ports:
      - "${GRAFANA_PORT:-3000}:3000" # another port, if something else has 3000
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/bourse.json
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro

  # Jaeger takes traces over OTLP, on 4317 (gRPC) and 4318 (HTTP), and shows them on 16686.
  jaeger:
    image: jaegertracing/jaeger:2.22.0
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"

  # The exchange itself, from our image, with the profile: docker compose --profile exchange up.
  # Nothing here is published to the host but Caddy, the only way in.
  engine:
    <<: *bourse
    entrypoint: [engine]
    environment:
      DATA_DIR: /var/lib/bourse
      SNAPSHOT_EVERY: 20000 # a sealed journal, ready for the backup, every 20,000 inputs
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    volumes:
      - journal:/var/lib/bourse
    stop_grace_period: 1m # time for the snapshot on the way out, before Docker sends SIGKILL
    healthcheck:
      test: [CMD, healthcheck, "http://localhost:8083/readyz"]
      interval: 2s
      retries: 60

  publisher:
    <<: *bourse
    entrypoint: [publisher]
    environment:
      DATA_DIR: /var/lib/bourse
      KAFKA: kafka:19092
    volumes:
      - journal:/var/lib/bourse:ro # it only reads the journal
    depends_on:
      engine: {condition: service_healthy}
      kafka: {condition: service_healthy}
    healthcheck:
      test: [CMD, healthcheck, "http://localhost:8085/healthz"]
      interval: 2s

  ledger:
    <<: *bourse
    entrypoint: [ledger]
    environment:
      LEDGER_URL: postgres://bourse:${POSTGRES_PASSWORD:-bourse}@postgres:5432/ledger
      KAFKA: kafka:19092
    depends_on:
      postgres: {condition: service_healthy}
      kafka: {condition: service_healthy}
    healthcheck:
      test: [CMD, healthcheck, "http://localhost:8082/healthz"]
      interval: 2s

  gateway:
    <<: *bourse
    entrypoint: [gateway]
    environment:
      ACCOUNTS_URL: postgres://bourse:${POSTGRES_PASSWORD:-bourse}@postgres:5432/accounts
      ENGINE_ADDR: engine:9083
      KAFKA: kafka:19092
      RATE_LIMIT: ${RATE_LIMIT:-10}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    stop_grace_period: 30s # longer than DRAIN
    depends_on:
      engine: {condition: service_healthy}
      postgres: {condition: service_healthy}
      kafka: {condition: service_healthy}
    healthcheck:
      test: [CMD, healthcheck, "http://localhost:8084/healthz"]
      interval: 2s

  marketdata:
    <<: *bourse
    entrypoint: [marketdata]
    environment:
      KAFKA: kafka:19092
    depends_on:
      kafka: {condition: service_healthy}
    healthcheck:
      test: [CMD, healthcheck, "http://localhost:8081/metrics"]
      interval: 2s

  # The only public door: TLS on a server, plain HTTP on port 80 on a laptop.
  caddy:
    image: caddy:2.11.9-alpine
    profiles: [exchange]
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    environment:
      SITE: ${SITE:-:80}
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy:/data
    depends_on:
      gateway: {condition: service_healthy}
      marketdata: {condition: service_healthy}

  # make backup: the snapshot and every sealed journal, from the engine's volume to the backups.
  backup:
    <<: *bourse
    profiles: [ops]
    restart: "no"
    entrypoint: [engine, backup, /backup]
    environment:
      DATA_DIR: /var/lib/bourse
    volumes:
      - journal:/var/lib/bourse:ro
      - backups:/backup

  # make drill: the backup, restored into an empty folder that's gone afterwards, and checked.
  drill:
    <<: *bourse
    profiles: [ops]
    restart: "no"
    entrypoint: [engine, drill, /backup]
    environment:
      DATA_DIR: /var/lib/bourse
    tmpfs:
      - /var/lib/bourse:uid=65532,gid=65532
    volumes:
      - backups:/backup:ro

volumes:
  pgdata:
  kafka:
  journal:
  backups:
  caddy:
