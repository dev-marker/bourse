syntax = "proto3";

package bourse.v1;

// EngineService takes orders and cancels for every symbol the engine trades.
service EngineService {
  // SubmitOrder sends an order to its symbol's book, and returns what happened to it.
  rpc SubmitOrder(SubmitOrderRequest) returns (SubmitOrderResponse);
  // CancelOrder takes a resting order out of its book.
  rpc CancelOrder(CancelOrderRequest) returns (CancelOrderResponse);
}

message SubmitOrderRequest {
  string symbol = 1;
  string account = 2;
  Side side = 3;
  OrderType type = 4;
  TimeInForce time_in_force = 5;
  string price = 6; // a decimal string like "101.25", empty for a market order
  int64 qty = 7;
  bool post_only = 8;
}

message SubmitOrderResponse {
  uint64 order_id = 1;
  repeated Event events = 2;
}

message CancelOrderRequest {
  string symbol = 1;
  uint64 order_id = 2;
}

message CancelOrderResponse {
  repeated Event events = 1;
}

// Event is one thing that happened to an order. seq counts the events of a symbol, with no gaps.
message Event {
  uint64 seq = 1;
  EventKind kind = 2;
  uint64 order_id = 3;
  uint64 maker_id = 4;
  string price = 5;
  int64 qty = 6;
  string reason = 7; // why, for a rejection
}

enum Side {
  SIDE_UNSPECIFIED = 0;
  SIDE_BUY = 1;
  SIDE_SELL = 2;
}

enum OrderType {
  ORDER_TYPE_UNSPECIFIED = 0;
  ORDER_TYPE_LIMIT = 1;
  ORDER_TYPE_MARKET = 2;
}

enum TimeInForce {
  TIME_IN_FORCE_UNSPECIFIED = 0;
  TIME_IN_FORCE_GTC = 1;
  TIME_IN_FORCE_IOC = 2;
  TIME_IN_FORCE_FOK = 3;
}

enum EventKind {
  EVENT_KIND_UNSPECIFIED = 0;
  EVENT_KIND_ACCEPTED = 1;
  EVENT_KIND_REJECTED = 2;
  EVENT_KIND_TRADED = 3;
  EVENT_KIND_RESTED = 4;
  EVENT_KIND_CANCELLED = 5;
}
