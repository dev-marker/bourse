# Every service, every five seconds. They run on the host, so from this container it's
# host.docker.internal, and each one's metrics are on its own port.
global:
  scrape_interval: 5s

scrape_configs:
  - job_name: gateway
    static_configs:
      - targets: ["host.docker.internal:8084"]
  - job_name: engine
    static_configs:
      - targets: ["host.docker.internal:8083"]
  - job_name: ledger
    static_configs:
      - targets: ["host.docker.internal:8082"]
  - job_name: marketdata
    static_configs:
      - targets: ["host.docker.internal:8081"]
