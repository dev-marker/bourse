# Every service, every five seconds, on its own admin port: on this machine for make run, and on the
# Compose network for the containers. Only one of the two answers at a time.
global:
  scrape_interval: 5s

scrape_configs:
  - job_name: gateway
    static_configs:
      - targets: ["host.docker.internal:8084", "gateway:8084"]
  - job_name: engine
    static_configs:
      - targets: ["host.docker.internal:8083", "engine:8083"]
  - job_name: publisher
    static_configs:
      - targets: ["host.docker.internal:8085", "publisher:8085"]
  - job_name: ledger
    static_configs:
      - targets: ["host.docker.internal:8082", "ledger:8082"]
  - job_name: marketdata
    static_configs:
      - targets: ["host.docker.internal:8081", "marketdata:8081"]
